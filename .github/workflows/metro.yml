name: Monitoreo Metro Santiago

on:
  schedule:
    # Corre cada 10 minutos, pero SOLO en horario de operación del Metro
    # (aprox. 6:00 a 23:00 hora Chile). El cron usa UTC, así que:
    #   6:00 Chile  = 10:00 UTC
    #   23:00 Chile = 03:00 UTC (del día siguiente)
    # Por eso el rango de horas queda "10-23,0-3" (cruza medianoche UTC).
    - cron: "*/10 10-23,0-3 * * *"
  workflow_dispatch:
    # Esto permite correrlo manualmente desde la pestaña "Actions" de GitHub,
    # útil para probar sin esperar al cron.

jobs:
  consultar-metro:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de monitoreo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python metro_completo.py
