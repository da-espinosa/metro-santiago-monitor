name: Monitoreo Metro Santiago

on:
  # El "schedule" interno de GitHub Actions quedó DESACTIVADO -- resultó
  # muy impreciso en la práctica (llegó a correr solo ~1 vez por hora en
  # vez de cada 10 min, insuficiente para detectar incidentes cortos).
  # Ahora el disparo lo hace un servicio externo (cron-job.org) llamando
  # a la API de GitHub para activar este workflow via workflow_dispatch,
  # con mucha mejor precisión al no compartir la cola gratuita de GitHub.
  workflow_dispatch:
    # Esto permite correrlo manualmente desde la pestaña "Actions" de GitHub,
    # Y es el mismo mecanismo que usa cron-job.org para dispararlo.

jobs:
  consultar-metro:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de monitoreo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python metro_completo.py
